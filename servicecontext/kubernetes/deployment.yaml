apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicecontext
  labels:
    app: servicecontext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servicecontext
  template:
    metadata:
      labels:
        app: servicecontext
    spec:
      containers:
        - name: servicecontext
          image: "a071098registry.azurecr.io/servicecontext:v1"
          ports:
            - containerPort: 8000
          # [추가] secret.yaml에 정의된 값들을 환경 변수로 주입합니다.
          envFrom:
            - secretRef:
                name: api-keys
            - configMapRef:
                name: my-configs
          readinessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 30
